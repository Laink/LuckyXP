plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // Curios API (head slot for the Lucky Glasses). Curios itself ships with the modpack at runtime.
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        // JEI API (optional integration: R/U hotkeys over the vending machine's articles).
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        // GeckoLib (the merchant's animated model). The full mod ships with the modpack at runtime.
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Sibling mods -- compile-time only; the modpack supplies them at runtime (never bundled).
    compileOnly files("libs/luckytweaks-${luckytweaks_version}.jar")
    compileOnly files("libs/luckystats-${luckystats_version}.jar")
    // Curios API - provides the head slot for the Lucky Glasses. Compile-only: the full Curios mod
    // is already supplied by the modpack at runtime, so we only need its API to compile against.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // JEI API, compile-only: the @JeiPlugin class is only ever loaded by JEI itself, so the mod
    // runs fine without JEI installed.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Improved Mobs, compile-only (NOT bundled): the merchant sells a difficulty cut, which has to go
    // through the mod's own difficulty data + sync so its bottom-right readout actually moves. Soft
    // dependency -- every reference lives in ImprovedMobsDifficulty, behind a ModList check.
    compileOnly files("libs/improvedmobs-1.20.1-1.13.7-forge.jar")
    compileOnly files("libs/immersivehotbar-1.1.2-forge-1.20.1.jar")
    // GeckoLib animation library (the animated Lucky Merchant), same version the modpack ships.
    implementation "software.bernie.geckolib:geckolib-forge-1.20.1:4.7.3"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
